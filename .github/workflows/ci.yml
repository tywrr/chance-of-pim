# Format, lint and tests for the Rust crates, a static arm64 build of the server, the deploy files,
# and the auth front's typecheck and tests, on every push and pull request. Nothing is deployed.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # A static aarch64 musl binary, as deploy/build-image.sh builds it: proves the TLS stack (ring)
  # cross-compiles without a C toolchain beyond zig.
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-musl
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.24.0
      - run: cargo zigbuild --release --locked --target aarch64-unknown-linux-musl --bin chance-of-pim
      - name: Pack the OCI archive
        run: |
          bin=target/aarch64-unknown-linux-musl/release/chance-of-pim
          file "$bin" | tee /dev/stderr | grep -Eq 'statically linked|static-pie linked'
          python3 deploy/oci-image.py "$bin" arm64 localhost/chance-of-pim:ci "$RUNNER_TEMP/image.tar"

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Both preinstalled on the runner image.
      - run: shellcheck deploy/*.sh deploy/k8s/*.sh
      - run: kubectl kustomize deploy/k8s/base >/dev/null

  auth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: auth/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
