apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: chance-of-pim
labels:
  - pairs: { app.kubernetes.io/part-of: chance-of-pim }
resources:
  - namespace.yaml
  - deployment.yaml
  - networkpolicy.yaml
configMapGenerator:
  # The hash suffix kustomize adds makes a config change roll the pod.
  - name: chance-of-pim-config
    files: [config.toml]
images:
  - name: ghcr.io/tywrr/chance-of-pim
    newTag: "0.1.2"
